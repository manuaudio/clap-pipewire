# A virtual output device ("CLAP effect sink") with a CLAP effect on it.
# Whatever plays to it goes through the plugin and on to the default output.
#
#   clap-pw-host /path/to/clap-sink.conf
#
# Find plugin ids and parameter names with:  clap-pw-info lsp-plugins.clap in.lsp-plug.filter_stereo

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "CLAP effect sink"
            media.name       = "CLAP effect sink"
            filter.graph = {
                nodes = [
                    {
                        type   = clap
                        name   = fx
                        plugin = "lsp-plugins.clap"            # found in ~/.clap, /usr/lib/clap, $CLAP_PATH
                        label  = "in.lsp-plug.filter_stereo"   # CLAP plugin id
                        # Controls take the plugin's own parameter values. LSP uses 0..1
                        # for frequencies; clap-pw-info converts what the plugin displays:
                        #   clap-pw-info lsp-plugins.clap in.lsp-plug.filter_stereo Frequency=800
                        control = {
                            "Filter_type"  = 0                 # Lo-pass
                            "Filter_slope" = 1                 # x2
                            "Frequency"    = 0.563009202       # 800 Hz
                        }
                        config = {
                            # or set values in the plugin's own text, once, at start:
                            # params = { "Frequency" = "800 Hz" }
                            # keep the plugin's whole state across restarts:
                            # state = "/home/me/.config/clap-pipewire/clap-sink.state"
                            # save-state = true
                        }
                    }
                ]
                inputs  = [ "fx:in_1" "fx:in_2" ]
                outputs = [ "fx:out_1" "fx:out_2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "effect_input.clap"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "effect_output.clap"
                node.passive = true
            }
        }
    }
]
