# A CLAP effect on a real output device, inserted by WirePlumber (>= 0.5) as a
# "smart filter": every stream that WirePlumber links to the device goes
# through the plugin first, without the application knowing.
#
# 1. Set filter.smart.target below to your device (pw-dump or `wpctl status`
#    + `wpctl inspect <id>` show node.name).
# 2. clap-pw-host /path/to/clap-smart-filter.conf
#
# Bypass without stopping it (WirePlumber's "filters" metadata):
#   pw-metadata -n filters <filter-node-id> filter.smart.disabled true
#   pw-metadata -n filters -d <filter-node-id> filter.smart.disabled
# Change a parameter live:
#   pw-cli set-param <filter-node-id> Props '{ params = [ "fx:Output_gain" -6.0 ] }'

context.properties = {
    log.level = 2
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "CLAP: LSP Filter Stereo"
            media.name       = "CLAP: LSP Filter Stereo"
            filter.graph = {
                nodes = [
                    {
                        type   = clap
                        name   = fx
                        plugin = "lsp-plugins.clap"
                        label  = "in.lsp-plug.filter_stereo"
                        # Lo-pass, x4, 500 Hz (clap-pw-info ... Frequency=500 -> 0.5026)
                        control = { "Filter_type" = 0 "Filter_slope" = 3 "Frequency" = 0.502622485 }
                    }
                ]
                inputs  = [ "fx:in_1" "fx:in_2" ]
                outputs = [ "fx:out_1" "fx:out_2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name           = "clap-fx.device-filter"
                media.class         = Audio/Sink
                filter.smart        = true
                filter.smart.name   = "clap-fx.device-filter"
                filter.smart.target = { node.name = "alsa_output.CHANGE-ME" }
            }
            playback.props = {
                node.name          = "clap-fx.device-filter.out"
                node.passive       = true
                # if the device goes away, remove the effect instead of
                # sending audio somewhere else
                node.dont-fallback = true
            }
        }
    }
]
